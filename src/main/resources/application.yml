spring:
  application:
    name: ssl-server

server:
  # RSA / GM 二选一。RSA 使用 Spring Boot 原生 server.ssl.*，GM 使用自定义 Kona/TLCP 主 Connector。
  ssl-mode: GM
  # 二选一模式下，server.port 就是当前模式的唯一服务端口。
  port: 8888
  ssl:
    # GM 模式下必须关闭 Spring Boot 原生 SSL，避免与自定义 GM Connector 冲突。
    # RSA 模式时改为 true，并配置 server.ssl.* 证书参数。
    enabled: false
  gm-ssl:
    enabled: true
    provider: Kona
    trust-store-provider: Kona
    trust-store-type: PKCS12
    trust-store: ssl/truststore.p12
    trust-store-password: 123456
    key-store-provider: Kona
    key-store-type: PKCS12
    key-store: ssl/keystore.p12
    key-store-password: 123456
    # 用于 SSLContext.getInstance(protocol, "Kona")，不用于判断 RSA/GM 模式。
    protocol: TLCP
    # required：强制要求客户端提供证书
    # optional：客户端可选提供证书
    # none：不验证客户端证书
    client-auth: required
    # SSL Session 超时时间（秒），8小时 = 28800秒
    session-timeout: 28800

logging:
  level:
    root: info
